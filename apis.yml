aid: provusinc
name: Provus
description: >-
  Provus (Provusinc) is an agentic AI Configure, Price, Quote (CPQ) platform
  built specifically for services organizations — professional services,
  consulting, and asset-based services firms. The platform turns unstructured
  inputs such as emails, RFPs, and call notes into structured, accurate services
  quotes, and runs a set of AI agents (Quote Optimizer, Deal Predictor, Proposal
  Response, Deal Rescue, and Provus Admin) that monitor deals, optimize pricing,
  assess risk, and protect margin. Provus ships two products — CPQ Express for
  growing teams and Enterprise Services CPQ for large organizations — with native
  connectors to Salesforce, HubSpot, Kantata, NetSuite, and DocuSign. It is
  backed by Norwest Venture Partners and reports managing over $5B in enterprise
  services revenue across customers including Thoughtworks, Trace3, and Prolifics.
  Provus does not currently publish a public developer API, OpenAPI specification,
  or developer portal; integration is delivered through native prebuilt
  connectors and a Salesforce AppExchange managed package, and product help
  documentation is hosted on a Document360 knowledge base at docs.provus.ai that
  302s the entire site to a login. Provus names an internal "Profet API" in its
  published sub-processor list, but that service is not documented, versioned, or
  reachable publicly.
