  note: >-
    Provus does not publish an API version, because it publishes no public API.
    Product versioning is vendor-managed: Provus states that customer
    environments are push-upgraded with the latest product releases, and that
    production patches are supported only on the latest product releases. The
    patch and feature release schedule is stated to be influenced by the
    Salesforce platform release cycle, since the product is a Salesforce-native
    managed package.
